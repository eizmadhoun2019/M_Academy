# Project: m-academy — own containers, volumes, network, ports and data.
# Ports and names are fixed by docs/operations/environments.md §2–§3.
# Usage: docker compose -p m-academy up -d --build --wait
name: m-academy

x-app: &app
  build:
    context: .
    args:
      INSTALL_DEV: "true"
  image: m-academy-web:dev
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    ACADEMY_DB_HOST: db
    ACADEMY_DB_PORT: "5432"
    ACADEMY_REDIS_URL: redis://redis:6379/0
    ACADEMY_CELERY_BROKER_URL: redis://redis:6379/1
    ACADEMY_CELERY_RESULT_URL: redis://redis:6379/2
    ACADEMY_EMAIL_HOST: mailhog
    ACADEMY_EMAIL_PORT: "1025"
  volumes:
    - .:/app
    - media:/data/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: >
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
      --access-logfile - --error-logfile -
    ports:
      - "127.0.0.1:8101:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    command: >
      celery -A config worker -Q default,media,notifications
      --concurrency=1 --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ACADEMY_DB_NAME:-academy}
      POSTGRES_USER: ${ACADEMY_DB_USER:-academy}
      POSTGRES_PASSWORD: ${ACADEMY_DB_PASSWORD:?set ACADEMY_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACADEMY_DB_USER:-academy} -d ${ACADEMY_DB_NAME:-academy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ${ACADEMY_MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ACADEMY_STORAGE_ACCESS_KEY:?set ACADEMY_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${ACADEMY_STORAGE_SECRET_KEY:?set ACADEMY_STORAGE_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    healthcheck:
      # The pinned MinIO image has no curl/wget; use bash /dev/tcp for a real HTTP probe.
      test: ["CMD", "/usr/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  createbuckets:
    # One-shot setup step, kept out of `up --wait`:
    #   docker compose -p m-academy --profile setup run --rm createbuckets
    profiles: ["setup"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      \"$${ACADEMY_STORAGE_ACCESS_KEY}\" \"$${ACADEMY_STORAGE_SECRET_KEY}\" &&
      mc mb --ignore-existing local/\$${ACADEMY_STORAGE_BUCKET} &&
      mc mb --ignore-existing local/academy-media-test &&
      echo buckets-ready"
    env_file:
      - .env

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:8126:8025"
      - "127.0.0.1:1126:1025"

volumes:
  pgdata:
  redisdata:
  miniodata:
  media:
