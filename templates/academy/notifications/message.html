<!doctype html>
<html lang="{{ language }}" dir="{{ direction }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;background:#f8fafc;color:#101820;font-family:Tahoma,Arial,sans-serif;line-height:1.7">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc">
<tr><td align="center" style="padding:24px 8px">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#fff;border:1px solid #e2e8f0;border-radius:12px">
<tr><td style="padding:24px;background:#101820;color:#fff;border-radius:12px 12px 0 0">
<p style="margin:0;color:#e8aa23;font-weight:bold">{{ brand }}</p>
<h1 style="margin:4px 0 0;font-size:24px">{{ subject }}</h1>
</td></tr>
<tr><td style="padding:16px 12px">
<p style="margin:0 0 16px">{{ body }}</p>
<p style="margin:24px 0 0"><a href="{{ url }}" style="display:inline-block;background:#101820;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:bold">{{ button }}</a></p>
</td></tr>
<tr><td style="padding:16px 24px;border-top:1px solid #e2e8f0;color:#526176;font-size:13px">{{ footer }}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
