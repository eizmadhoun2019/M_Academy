# Masheed_Academy Performance Profile
# Canonical project location: docs/performance-profile.yaml
# CHARTER owns and approves the targets and assumptions below; ARCHITECTURE owns measured
# constraints and decisions and links to this file.
performance_profile:
  workload_tier: medium
  workload:
    expected_users: 1000            # registered learners (single organization, Phase 1)
    concurrent_users: 200           # concurrent video viewers (~14 heartbeat req/s)
    largest_dataset: "100 courses / 500 lessons / 100_000 progress rows; 20 concurrent admins"
    update_frequency: "heartbeats ~14/s; uploads and admin writes sporadic"
    critical_workloads:
      - "video playback start < 3 s on 5 Mbps"
      - "heartbeat processing (anti-skip correctness under concurrency)"
      - "reminder/notification dispatch at due-date scale"
  targets:
    primary_user_journey: "learner: open my courses -> resume lesson -> watch -> next lesson unlocked"
    api_or_operation_latency: "p95 < 300 ms non-media; heartbeat p95 < 150 ms at design capacity"
    throughput_or_completion_time: "200 concurrent viewers; 14 heartbeats/s without degradation"
  page_budgets: "LCP <= 2.5 s; CLS <= 0.1; INP <= 200 ms on mid-range phone over 4G (excl. video)"
  availability: "99.5% monthly (planned maintenance excluded); 99.9% is a Phase-3 target"
  recovery: "RPO <= 24 h (daily encrypted off-host backup); RTO <= 4 h; restore drill before release and quarterly"
  safeguards:
    pagination_or_result_limits: "page size 25; body limit 2 MiB API / large media via presigned storage"
    query_regression_tests: "query-count assertions on list selectors and endpoints; N+1 review at release"
    performance_ci_budget: "load test (Locust) at design capacity before release gate"
  cost:
    infrastructure_assumptions: "two-server topology (Hub + Academy), object storage behind CDN in production"
    paid_services: "storage/bandwidth for video (provider open, D-001)"
    scaling_cost_risks: "video bandwidth grows with concurrent viewers; HLS renditions cap per-viewer bitrate"
    vendor_lock_in: "storage kept behind StorageAdapter; Hub behind 4 adapters"
  revisit_triggers:
    - user or data growth beyond design capacity
    - measured p95 degradation in load test or production
    - new critical workload (e.g. quizzes, certificates in Phase 2)
    - storage provider or cost change (D-001)
  reviewed_by: "Project owner"
  last_reviewed: "2026-11-22"
